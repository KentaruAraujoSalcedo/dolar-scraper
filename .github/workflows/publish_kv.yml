name: Scrape and publish to Cloudflare KV

on:
  workflow_dispatch:

concurrency:
  group: scrape-and-publish
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium + deps
        run: |
          python -m playwright --version
          python -m playwright install --with-deps chromium

      # ✅ Solo traemos last_known_tasas.json del KV (ya no usamos historico.json)
      - name: Download last_known_tasas.json from Cloudflare KV (validated)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          mkdir -p data

          echo "⬇️ Download last_known_tasas.json from KV..."
          curl -f -sS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/last_known_tasas.json" \
            -o data/last_known_tasas.json || true

          if [ ! -s data/last_known_tasas.json ]; then
            echo "⚠️ last_known_tasas.json vacío/no existe en KV. Inicializando estructura"
            echo '{"updated_at":null,"casas":{}}' > data/last_known_tasas.json
          fi

          python - << 'PY'
          import json
          p="data/last_known_tasas.json"
          with open(p,"r",encoding="utf-8") as f:
              data=json.load(f)
          if not isinstance(data, dict):
              raise SystemExit("last_known_tasas.json no es objeto JSON")
          print("✅ last_known_tasas.json OK.")
          PY

          echo "✅ Files in data/:"
          ls -lah data

      # ✅ solo borra lo que se regenera siempre
      - name: Clean previous output
        run: |
          rm -f data/tasas.json data/meta.json data/sunat_mensual.json || true

      - name: Run scrapers
        run: |
          python run_scrapers.py

      - name: Verify output exists
        run: |
          test -f data/tasas.json
          test -f data/meta.json
          test -f data/last_known_tasas.json
          test -f data/sunat_mensual.json

          echo "meta.json:"
          cat data/meta.json

          echo "sunat_mensual.json (head):"
          head -n 40 data/sunat_mensual.json || true

      - name: Upload tasas.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/tasas.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/tasas.json

      - name: Upload meta.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/meta.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/meta.json

      - name: Upload sunat_mensual.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/sunat_mensual.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/sunat_mensual.json

      - name: Upload last_known_tasas.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/last_known_tasas.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/last_known_tasas.json
