name: Scrape and publish to Cloudflare KV

on:
  workflow_dispatch:

# Evita interrumpir una corrida que ya inició. Si se generan muchos disparos,
# GitHub puede reemplazar ejecuciones pendientes; este no es un sistema de colas.
concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      TUCAMBISTA_OCP_KEY: ${{ secrets.TUCAMBISTA_OCP_KEY }}
      CAMBIX_OCP_KEY: ${{ secrets.CAMBIX_OCP_KEY }}
      MIN_VALID_QUOTES: '30'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test infrastructure without network
        run: python -m unittest discover -s tests -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright --version
          python -m playwright install chromium

      - name: Prepare output folder
        run: |
          mkdir -p data
          rm -f data/meta.json data/diagnostico_scrapers.json data/diagnostico_scrapers.csv data/sunat_status.json

      # GitHub runner is ephemeral. Reuse existing SUNAT month if valid.
      # A 404 (key not created yet) is acceptable; invalid credentials are not.
      - name: Download valid SUNAT history from Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python -m infra.cloudflare_kv download-sunat

      - name: Run all scrapers and generate diagnostics
        run: python run_scrapers.py

      - name: Verify diagnostics exist
        run: |
          test -s data/tasas.json
          test -s data/meta.json
          test -s data/diagnostico_scrapers.json
          test -s data/diagnostico_scrapers.csv
          test -s data/sunat_status.json
          python -m json.tool data/meta.json >/dev/null
          python -m json.tool data/diagnostico_scrapers.json >/dev/null
          echo 'Revisa la pestaña Summary para ver las casas con problemas.'

      # Downloadable even if publication is refused; no private tracebacks.
      - name: Upload diagnostics as GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scrapers-${{ github.run_id }}
          path: |
            data/diagnostico_scrapers.json
            data/diagnostico_scrapers.csv
            data/meta.json
            data/sunat_status.json
          retention-days: 7
          if-no-files-found: warn

      # Validate batch BEFORE any write. Existing KV keys stay unchanged if
      # too few scrapers succeeded. SUNAT only writes when newly refreshed.
      - name: Validate and publish safely to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python -m infra.cloudflare_kv publish
