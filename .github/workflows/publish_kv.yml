name: Scrape and publish to Cloudflare KV

on:
  workflow_dispatch:

concurrency:
  group: scrape-and-publish
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium + deps
        run: |
          python -m playwright --version
          python -m playwright install --with-deps chromium

      # ✅ Solo borra lo que siempre se regenera en cada run
      - name: Clean previous output
        run: |
          rm -f data/tasas.json data/meta.json || true
          mkdir -p data

      # ✅ IMPORTANTÍSIMO:
      # El runner es nuevo cada vez, así que bajamos el sunat_mensual.json actual desde KV.
      # Esto permite que run_scrapers.py detecte "ya se corrió hoy" y haga SKIP.
      - name: Download existing sunat_mensual.json from Cloudflare KV (if any)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/sunat_mensual.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o data/sunat_mensual.json || true

          # Si bajó vacío, lo eliminamos para no confundir al script
          if [ ! -s data/sunat_mensual.json ]; then
            rm -f data/sunat_mensual.json || true
          fi

      - name: Run scrapers
        run: |
          python run_scrapers.py

      - name: Verify output exists
        run: |
          test -f data/tasas.json
          test -f data/meta.json
          test -f data/sunat_mensual.json

          echo "meta.json:"
          cat data/meta.json

          echo "sunat_mensual.json (head):"
          head -n 40 data/sunat_mensual.json || true

      - name: Upload tasas.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/tasas.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/tasas.json

      - name: Upload meta.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/meta.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/meta.json

      - name: Upload sunat_mensual.json to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -f -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/sunat_mensual.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/sunat_mensual.json
