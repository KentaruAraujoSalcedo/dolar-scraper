
name: Diagnostico Global66

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar httpx
        run: python -m pip install httpx

      - name: Probar cotizaciones Global66
        run: |
          python - <<'PY'
          import asyncio
          import httpx
          from scrapers.global66 import API, HEADERS, PEN_ROUTE, USD_ROUTE

          async def main():
              pruebas = [
                  ("PEN a USD", PEN_ROUTE, USD_ROUTE, 1000),
                  ("USD a PEN", USD_ROUTE, PEN_ROUTE, 300),
              ]

              async with httpx.AsyncClient(
                  headers=HEADERS,
                  timeout=20,
                  follow_redirects=True
              ) as client:
                  for nombre, origen, destino, monto in pruebas:
                      try:
                          respuesta = await client.get(
                              API,
                              params={
                                  "originRoute": origen,
                                  "destinationRoute": destino,
                                  "amount": monto,
                                  "way": "origin",
                                  "paymentType": "WIRE_TRANSFER",
                              }
                          )
                          print(f"{nombre}: HTTP {respuesta.status_code}")
                      except httpx.RequestError as error:
                          print(
                              f"{nombre}: error {type(error).__name__}"
                          )

          asyncio.run(main())
          PY
