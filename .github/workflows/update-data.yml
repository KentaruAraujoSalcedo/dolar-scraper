name: Update dolar data

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# ✅ NUEVO: evita acumulación de jobs si GitHub falla
concurrency:
  group: update-dolar-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    # ✅ NUEVO: evita jobs colgados esperando runner
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        run: |
          python run_scrapers.py
          ls -la data

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cambiafx
          path: |
            data/cambiafx_error.png
            data/cambiafx_error.html

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tasas.json data/historico.json data/last_known_tasas.json data/meta.json
          git commit -m "Update data" || exit 0
          git push

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/tasas.json data/historico.json data/last_known_tasas.json data/meta.json

          git commit -m "Update data" || exit 0
          git push
